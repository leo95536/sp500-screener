<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S&amp;P500 사이클 스크리너</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --up: #d03b3b;        /* 상승·양수 = 빨강 (한국식) */
    --down: #1c5cab;      /* 하락·음수 = 파랑 */
    --tsu: #f04452;       /* 토스 상승 빨강 */
    --tsd: #3182f6;       /* 토스 하락 파랑 */
    --row-hover: rgba(11, 11, 11, 0.035);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --border: rgba(255, 255, 255, 0.10);
      --up: #e66767;
      --down: #6da7ec;
      --tsu: #f8626c;
      --tsd: #5c9dff;
      --row-hover: rgba(255, 255, 255, 0.045);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 64px; }

  header h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13px; margin: 0; }
  .sub .kst { color: var(--muted); }

  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin: 20px 0 28px;
  }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .kpi .label { font-size: 12px; color: var(--muted); }
  .kpi .value { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; }
  .kpi .value small { font-size: 13px; font-weight: 400; color: var(--muted); }

  section { margin-bottom: 36px; }
  section h2 { font-size: 16px; margin: 0 0 2px; }
  section h2 .h2-tag { color: var(--muted); font-weight: 400; font-size: 13px; }
  .section-note { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }

  .table-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-x: auto;
  }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; white-space: nowrap; }
  th, td { padding: 8px 12px; text-align: right; }
  th:nth-child(-n+3), td:nth-child(-n+3) { text-align: left; }
  thead th {
    font-size: 12px; font-weight: 600; color: var(--muted);
    border-bottom: 1px solid var(--grid);
    cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface);
  }
  thead th:hover { color: var(--ink); }
  thead th .arrow { font-size: 10px; }
  thead th .arrow.dim { opacity: 0.4; }
  tbody tr { border-bottom: 1px solid var(--grid); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--row-hover); }
  td.num { font-variant-numeric: tabular-nums; }
  td .name { color: var(--ink-2); }
  td .sector { color: var(--muted); font-size: 12px; }
  .ticker { font-weight: 650; }
  .pos { color: var(--up); }
  .neg { color: var(--down); }
  .empty { padding: 28px; text-align: center; color: var(--muted); font-size: 13.5px; }

  /* ── 행 클릭 차트 (토스증권 스타일) ── */
  tbody tr.data-row { cursor: pointer; }
  tr.detail-row:hover { background: none; }
  tr.detail-row > td { padding: 0; }
  .chartbox { padding: 16px 16px 10px; }
  .ts-price { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .ts-sub { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ts-sub .dt { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .ts-up { color: var(--tsu); }
  .ts-down { color: var(--tsd); }
  .chwrap { position: relative; margin-top: 6px; }
  .chwrap svg { display: block; width: 100%; height: auto; }
  .ts-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .ts-minmax { font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .ts-hair { stroke: var(--muted); stroke-width: 1; opacity: 0; }
  .ts-dot { stroke: var(--surface); stroke-width: 2; opacity: 0; }
  .ts-datepill {
    position: absolute; top: 0; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    font-size: 11px; color: var(--muted); padding: 1px 7px;
    opacity: 0; pointer-events: none; white-space: nowrap;
  }
  .ts-tabs { display: flex; gap: 4px; margin-top: 4px; }
  .ts-tab {
    flex: 1; text-align: center; font-size: 13px; font-weight: 600; font-family: inherit;
    border: none; background: none; color: var(--muted);
    padding: 6px 0; border-radius: 8px; cursor: pointer;
  }
  .ts-tab:hover { color: var(--ink-2); }
  .ts-tab.on { background: var(--row-hover); color: var(--ink); }
  .ch-loading { padding: 36px; text-align: center; color: var(--muted); font-size: 13px; }

  footer { border-top: 1px solid var(--grid); padding-top: 16px; color: var(--muted); font-size: 12.5px; }
  footer ul { margin: 6px 0 12px; padding-left: 18px; }
  footer li { margin: 2px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>S&amp;P500 사이클 스크리너</h1>
    <p class="sub">1단계 — 시장의 지속적 관심(거래대금) 필터.
      <span class="kst" id="updated"></span></p>
  </header>

  <div class="kpis" id="kpis"></div>

  <section>
    <h2>조건 1 통과 종목 <span class="h2-tag">거래대금 기준 유동성 필터</span></h2>
    <p class="section-note" id="note"></p>
    <div class="table-box"><div id="stock-table"></div></div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
const fmt = {
  money(v) { return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },
};

function makeTable(rows, cols, mountId, emptyMsg, rowDetail) {
  const mount = document.getElementById(mountId);
  if (!rows.length) { mount.innerHTML = `<div class="empty">${emptyMsg}</div>`; return; }
  let sortKey = null, sortDir = -1;

  function render() {
    const sorted = [...rows];
    if (sortKey !== null) {
      sorted.sort((a, b) => {
        const [x, y] = [cols[sortKey].val(a), cols[sortKey].val(b)];
        if (x === null) return 1;
        if (y === null) return -1;
        return (x < y ? -1 : x > y ? 1 : 0) * sortDir;
      });
    }
    const head = cols.map((c, i) =>
      `<th data-i="${i}">${c.label}<span class="arrow${i === sortKey ? '' : ' dim'}"> ${i === sortKey ? (sortDir < 0 ? '▼' : '▲') : '↕'}</span></th>`).join('');
    const body = sorted.map(r =>
      `<tr>${cols.map(c => `<td class="num">${c.cell(r)}</td>`).join('')}</tr>`).join('');
    mount.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
    mount.querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
      const i = +th.dataset.i;
      sortDir = i === sortKey ? -sortDir : -1;
      sortKey = i;
      render();
    }));
    if (rowDetail) mount.querySelectorAll('tbody tr').forEach((tr, k) => {
      tr.classList.add('data-row');
      tr.addEventListener('click', () => {
        const next = tr.nextElementSibling;
        if (next && next.classList.contains('detail-row')) { next.remove(); return; }
        const dtr = document.createElement('tr');
        dtr.className = 'detail-row';
        const td = document.createElement('td');
        td.colSpan = cols.length;
        const box = document.createElement('div');
        box.className = 'chartbox';
        td.appendChild(box);
        dtr.appendChild(td);
        tr.after(dtr);
        rowDetail(box, sorted[k]);
      });
    });
  }
  render();
}

async function loadChart(box, r) {
  box.innerHTML = '<div class="ch-loading">차트 불러오는 중…</div>';
  try {
    const ch = await (await fetch(`charts/${r.ticker}.json?ts=${Date.now()}`)).json();
    const state = { range: '전체' };
    renderBig(box, ch, state);
  } catch (e) {
    box.innerHTML = '<div class="ch-loading">차트를 불러오지 못했습니다</div>';
  }
}

const TS_RANGES = { '1주': 7, '1달': 30, '3달': 91, '1년': 365, '5년': 1826, '전체': null };
const TS_LABELS = {
  '1주': '1주일 전보다', '1달': '1달 전보다', '3달': '3달 전보다',
  '1년': '1년 전보다', '5년': '5년 전보다', '전체': '10년 전보다',
};

function renderBig(box, ch, state) {
  const nAll = ch.close.length;
  const days = TS_RANGES[state.range];
  let s0 = 0;
  if (days !== null) {
    const lastDate = new Date(ch.dates[nAll - 1]);
    const startStr = new Date(lastDate.getTime() - days * 86400e3).toISOString().slice(0, 10);
    s0 = ch.dates.findIndex(d => d >= startStr);
    if (s0 < 0) s0 = 0;
  }
  const C = ch.close.slice(s0), D = ch.dates.slice(s0);
  const n = C.length;
  const up = C[n - 1] >= C[0];
  const tone = up ? 'ts-up' : 'ts-down';
  const stroke = up ? 'var(--tsu)' : 'var(--tsd)';

  const W = 1000, H = 300, ML = 14, MR = 14, MT = 40, MB = 40;
  const lo = Math.min(...C), hi = Math.max(...C);
  const pad = (hi - lo) * 0.05 || 1;
  const a = lo - pad, b = hi + pad;
  const xs = i => ML + (W - ML - MR) * (n === 1 ? 0 : i / (n - 1));
  const ys = v => MT + (H - MT - MB) * (1 - (v - a) / (b - a));

  const pts = C.map((v, i) => `${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(' ');
  const area = `M${xs(0).toFixed(1)},${(H - MB)} L${pts.replaceAll(' ', ' L')} L${xs(n - 1).toFixed(1)},${H - MB} Z`;

  const iHi = C.indexOf(hi), iLo = C.indexOf(lo);
  const clampX = x => Math.min(Math.max(x, 46), W - 46);
  const gid = `g-${ch.ticker}-${up ? 'u' : 'd'}`;

  const short = ['1주', '1달', '3달'].includes(state.range);
  const xdate = s => short ? s.replaceAll('-', '.') : s.slice(0, 7).replace('-', '.');
  let xTicks = '';
  for (let k = 0; k < 4; k++) {
    const i = Math.round((n - 1) * (k + 0.5) / 4);
    xTicks += `<text class="ts-minmax" x="${xs(i).toFixed(1)}" y="${H - 10}" text-anchor="middle">${xdate(D[i])}</text>`;
  }

  const pctOf = v => {
    const p = (v / C[0] - 1) * 100;
    return (p >= 0 ? '+' : '') + p.toLocaleString('en-US', { maximumFractionDigits: 1 }) + '%';
  };

  box.innerHTML = `
    <div class="ts-price">${fmt.money(C[n - 1])}</div>
    <div class="ts-sub ${tone}">${TS_LABELS[state.range]} ${pctOf(C[n - 1])}<span class="dt"></span></div>
    <div class="chwrap">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${ch.ticker} ${state.range} 차트">
        <defs>
          <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="${stroke}" stop-opacity="0.14"/>
            <stop offset="1" stop-color="${stroke}" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="${area}" fill="url(#${gid})"/>
        <polyline class="ts-line" stroke="${stroke}" points="${pts}"/>
        ${xTicks}
        <text class="ts-minmax" x="${clampX(xs(iHi)).toFixed(1)}" y="${(ys(hi) - 10).toFixed(1)}" text-anchor="middle">최고 ${fmt.money(hi)}</text>
        <text class="ts-minmax" x="${clampX(xs(iLo)).toFixed(1)}" y="${(ys(lo) + 18).toFixed(1)}" text-anchor="middle">최저 ${fmt.money(lo)}</text>
        <line class="ts-hair" y1="${MT - 14}" y2="${H - MB + 8}" x1="0" x2="0"/>
        <circle class="ts-dot" r="4.5" fill="${stroke}"/>
        <rect fill="none" pointer-events="all" x="${ML}" y="0" width="${W - ML - MR}" height="${H}"/>
      </svg>
      <div class="ts-datepill"></div>
    </div>
    <div class="ts-tabs">
      ${Object.keys(TS_RANGES).map(k => `<button class="ts-tab${state.range === k ? ' on' : ''}" data-r="${k}">${k}</button>`).join('')}
    </div>`;

  box.querySelectorAll('.ts-tab').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    state.range = btn.dataset.r;
    renderBig(box, ch, state);
  }));
  box.querySelector('.chwrap').addEventListener('click', e => e.stopPropagation());

  const svg = box.querySelector('svg');
  const hair = svg.querySelector('.ts-hair');
  const dot = svg.querySelector('.ts-dot');
  const pill = box.querySelector('.ts-datepill');
  const priceEl = box.querySelector('.ts-price');
  const subEl = box.querySelector('.ts-sub');
  const dtEl = subEl.querySelector('.dt');
  const overlay = svg.querySelector('rect');
  const baseLabel = TS_LABELS[state.range];

  overlay.addEventListener('pointermove', e => {
    const bx = svg.getBoundingClientRect();
    const px = (e.clientX - bx.left) / bx.width * W;
    const i = Math.max(0, Math.min(n - 1, Math.round((px - ML) / (W - ML - MR) * (n - 1))));
    const x = xs(i);
    hair.setAttribute('x1', x); hair.setAttribute('x2', x);
    hair.style.opacity = 0.6;
    dot.setAttribute('cx', x); dot.setAttribute('cy', ys(C[i]));
    dot.style.opacity = 1;
    priceEl.textContent = fmt.money(C[i]);
    subEl.firstChild.textContent = `${state.range === '전체' ? '시작' : baseLabel.replace(' 전보다', ' 전')} 대비 ${pctOf(C[i])}`;
    dtEl.textContent = D[i];
    const wrapBox = box.querySelector('.chwrap').getBoundingClientRect();
    pill.style.left = Math.min(Math.max((x / W) * wrapBox.width, 34), wrapBox.width - 34) + 'px';
    pill.textContent = D[i];
    pill.style.opacity = 1;
  });
  overlay.addEventListener('pointerleave', () => {
    hair.style.opacity = 0; dot.style.opacity = 0; pill.style.opacity = 0;
    priceEl.textContent = fmt.money(C[n - 1]);
    subEl.firstChild.textContent = `${baseLabel} ${pctOf(C[n - 1])}`;
    dtEl.textContent = '';
  });
}

async function main() {
  const res = await fetch('data.json?ts=' + Date.now());
  const d = await res.json();
  const cfg = d.config;

  document.getElementById('updated').textContent = `업데이트 ${d.updated_kst}`;

  document.getElementById('kpis').innerHTML = [
    ['S&P500 종목', d.universe_count, ''],
    [`거래대금 $${cfg.MIN_DOLLAR_VOLUME_M}M+ 유지`, d.stocks.length, '조건 1'],
  ].map(([label, v, tag]) =>
    `<div class="kpi"><div class="label">${label}</div><div class="value">${v}<small> ${tag}</small></div></div>`).join('');

  document.getElementById('note').textContent =
    `분기(${cfg.SUSTAIN_WINDOW_DAYS}거래일) 이동평균 거래대금(종가×거래량)이 최근 ${cfg.LIQUIDITY_YEARS}년 내내 $${cfg.MIN_DOLLAR_VOLUME_M}M 이상이었던 종목. 2년 평균 거래대금 큰 순. 행을 클릭하면 차트가 열립니다 (기간 탭 전환, 호버 시 해당 시점 가격 표시).`;

  makeTable(d.stocks, [
    { label: '티커', val: r => r.ticker, cell: r => `<span class="ticker">${r.ticker}</span>` },
    { label: '이름', val: r => r.name_kr || r.name, cell: r =>
      r.name_kr && r.name_kr !== r.name
        ? `<span class="name">${r.name_kr}</span> <span class="sector">${r.name}</span>`
        : `<span class="name">${r.name}</span>` },
    { label: '섹터', val: r => r.sector, cell: r => `<span class="sector">${r.sector}</span>` },
    { label: '현재가', val: r => r.price, cell: r => fmt.money(r.price) },
    { label: '거래대금 (2년 평균)', val: r => r.avg_dollar_vol_b, cell: r => '$' + r.avg_dollar_vol_b.toFixed(2) + 'B' },
    { label: '최저 분기평균', val: r => r.roll_min_b, cell: r => '$' + r.roll_min_b.toFixed(2) + 'B' },
    { label: '관심도 (1개월/2년)', val: r => r.interest_ratio, cell: r => r.interest_ratio.toFixed(2) + '×' },
  ], 'stock-table', '조건 1을 통과한 종목이 없습니다.', loadChart);

  document.getElementById('footer').innerHTML = `
    <strong>조건 1 — 시장의 지속적 관심</strong>
    <ul>
      <li>일일 거래대금 = 종가 × 거래량 (배당·분할 반영 수정종가, Yahoo Finance)</li>
      <li>분기(${cfg.SUSTAIN_WINDOW_DAYS}거래일) 이동평균 거래대금이 최근 ${cfg.LIQUIDITY_YEARS}년 동안 한 번도 $${cfg.MIN_DOLLAR_VOLUME_M}M 아래로 내려가지 않아야 통과</li>
      <li>관심도 = 최근 ${cfg.INTEREST_RECENT_DAYS}거래일 평균 거래대금 ÷ ${cfg.LIQUIDITY_YEARS}년 평균 — 1보다 크면 최근 관심 증가</li>
      <li>${cfg.LIQUIDITY_YEARS}년치 데이터가 없는 종목(최근 상장 등)은 검증 불가로 제외</li>
    </ul>
    이 도구는 후보 발굴용이며 매수 판단과 책임은 사용자에게 있습니다.`;
}
main().catch(e => {
  document.getElementById('kpis').innerHTML = `<div class="empty">data.json을 불러오지 못했습니다: ${e}</div>`;
});
</script>
</body>
</html>
