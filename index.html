<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S&amp;P500 사이클 스크리너</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --up: #d03b3b;        /* 상승·양수 = 빨강 (한국식) */
    --down: #1c5cab;      /* 하락·음수 = 파랑 */
    --tsu: #f04452;       /* 토스 상승 빨강 */
    --tsd: #3182f6;       /* 토스 하락 파랑 */
    --row-hover: rgba(11, 11, 11, 0.035);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --border: rgba(255, 255, 255, 0.10);
      --up: #e66767;
      --down: #6da7ec;
      --tsu: #f8626c;
      --tsd: #5c9dff;
      --row-hover: rgba(255, 255, 255, 0.045);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 64px; }

  header h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13px; margin: 0; }
  .sub .kst { color: var(--muted); }

  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin: 20px 0 28px;
  }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .kpi .label { font-size: 12px; color: var(--muted); }
  .kpi .value { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; }
  .kpi .value small { font-size: 13px; font-weight: 400; color: var(--muted); }

  section { margin-bottom: 36px; }
  section h2 { font-size: 16px; margin: 0 0 2px; }
  section h2 .h2-tag { color: var(--muted); font-weight: 400; font-size: 13px; }
  .section-note { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }

  .table-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-x: auto;
  }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; white-space: nowrap; }
  th, td { padding: 8px 12px; text-align: right; }
  th:nth-child(-n+3), td:nth-child(-n+3) { text-align: left; }
  thead th {
    font-size: 12px; font-weight: 600; color: var(--muted);
    border-bottom: 1px solid var(--grid);
    cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface);
  }
  thead th:hover { color: var(--ink); }
  thead th .arrow { font-size: 10px; }
  thead th .arrow.dim { opacity: 0.4; }
  tbody tr { border-bottom: 1px solid var(--grid); }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--row-hover); }
  td.num { font-variant-numeric: tabular-nums; }
  td .name { color: var(--ink-2); }
  td .sector { color: var(--muted); font-size: 12px; }
  .ticker { font-weight: 650; }
  .pos { color: var(--up); }
  .neg { color: var(--down); }
  .empty { padding: 28px; text-align: center; color: var(--muted); font-size: 13.5px; }

  /* ── 행 클릭 차트 (토스증권 스타일) ── */
  tbody tr.data-row { cursor: pointer; }
  tr.detail-row:hover { background: none; }
  tr.detail-row > td { padding: 0; }
  .chartbox { padding: 16px 16px 10px; }
  .ts-headrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .ts-type { display: flex; gap: 2px; }
  .ts-type .ts-tab { flex: none; padding: 4px 12px; }
  .ts-price { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .ts-sub { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ts-sub .dt { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .ts-up { color: var(--tsu); }
  .ts-down { color: var(--tsd); }
  .chwrap { position: relative; margin-top: 6px; }
  .chwrap svg { display: block; width: 100%; height: auto; }
  .ts-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .ts-minmax { font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .ts-hair { stroke: var(--muted); stroke-width: 1; opacity: 0; }
  .ts-dot { stroke: var(--surface); stroke-width: 2; opacity: 0; }
  .ts-datepill {
    position: absolute; top: 0; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    font-size: 11px; color: var(--muted); padding: 1px 7px;
    opacity: 0; pointer-events: none; white-space: nowrap;
  }
  .ts-brush { display: block; width: 100%; height: auto; margin-top: 4px; touch-action: none; }
  .ts-bl { fill: none; stroke: var(--muted); stroke-width: 1.2; opacity: 0.8; }
  .ts-dim { fill: var(--page); opacity: 0.6; }
  .ts-win { fill: var(--row-hover); stroke: var(--muted); stroke-width: 1; }
  .ts-handle { fill: var(--muted); }
  .ts-tabs { display: flex; gap: 4px; margin-top: 4px; }
  .ts-tab {
    flex: 1; text-align: center; font-size: 13px; font-weight: 600; font-family: inherit;
    border: none; background: none; color: var(--muted);
    padding: 6px 0; border-radius: 8px; cursor: pointer;
  }
  .ts-tab:hover { color: var(--ink-2); }
  .ts-tab.on { background: var(--row-hover); color: var(--ink); }
  .ch-loading { padding: 36px; text-align: center; color: var(--muted); font-size: 13px; }

  footer { border-top: 1px solid var(--grid); padding-top: 16px; color: var(--muted); font-size: 12.5px; }
  footer ul { margin: 6px 0 12px; padding-left: 18px; }
  footer li { margin: 2px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>S&amp;P500 사이클 스크리너</h1>
    <p class="sub">1단계 — 시장의 지속적 관심(거래대금) 필터.
      <span class="kst" id="updated"></span></p>
  </header>

  <div class="kpis" id="kpis"></div>

  <section>
    <h2>조건 1 통과 종목 <span class="h2-tag">거래대금 기준 유동성 필터</span></h2>
    <p class="section-note" id="note"></p>
    <div class="table-box"><div id="stock-table"></div></div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
const fmt = {
  money(v) { return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); },
};

function makeTable(rows, cols, mountId, emptyMsg, rowDetail) {
  const mount = document.getElementById(mountId);
  if (!rows.length) { mount.innerHTML = `<div class="empty">${emptyMsg}</div>`; return; }
  let sortKey = null, sortDir = -1;

  function render() {
    const sorted = [...rows];
    if (sortKey !== null) {
      sorted.sort((a, b) => {
        const [x, y] = [cols[sortKey].val(a), cols[sortKey].val(b)];
        if (x === null) return 1;
        if (y === null) return -1;
        return (x < y ? -1 : x > y ? 1 : 0) * sortDir;
      });
    }
    const head = cols.map((c, i) =>
      `<th data-i="${i}">${c.label}<span class="arrow${i === sortKey ? '' : ' dim'}"> ${i === sortKey ? (sortDir < 0 ? '▼' : '▲') : '↕'}</span></th>`).join('');
    const body = sorted.map(r =>
      `<tr>${cols.map(c => `<td class="num">${c.cell(r)}</td>`).join('')}</tr>`).join('');
    mount.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
    mount.querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
      const i = +th.dataset.i;
      sortDir = i === sortKey ? -sortDir : -1;
      sortKey = i;
      render();
    }));
    if (rowDetail) mount.querySelectorAll('tbody tr').forEach((tr, k) => {
      tr.classList.add('data-row');
      tr.addEventListener('click', () => {
        const next = tr.nextElementSibling;
        if (next && next.classList.contains('detail-row')) { next.remove(); return; }
        const dtr = document.createElement('tr');
        dtr.className = 'detail-row';
        const td = document.createElement('td');
        td.colSpan = cols.length;
        const box = document.createElement('div');
        box.className = 'chartbox';
        td.appendChild(box);
        dtr.appendChild(td);
        tr.after(dtr);
        rowDetail(box, sorted[k]);
      });
    });
  }
  render();
}

async function loadChart(box, r) {
  box.innerHTML = '<div class="ch-loading">차트 불러오는 중…</div>';
  try {
    const ch = await (await fetch(`charts/${r.ticker}.json?ts=${Date.now()}`)).json();
    const state = { preset: '전체', type: 'line', i0: null, i1: null };
    renderBig(box, ch, state);
  } catch (e) {
    box.innerHTML = '<div class="ch-loading">차트를 불러오지 못했습니다</div>';
  }
}

const TS_RANGES = { '1주': 7, '1달': 30, '3달': 91, '1년': 365, '5년': 1826, '전체': null };
const TS_LABELS = {
  '1주': '1주일 전보다', '1달': '1달 전보다', '3달': '3달 전보다',
  '1년': '1년 전보다', '5년': '5년 전보다', '전체': '10년 전보다',
};
// 캔들 봉 단위는 보이는 구간 길이에 따라 자동 전환 (일봉이 뭉개지지 않도록)
const TS_BUCKET_NAME = { d: '일봉', w: '주봉', m: '월봉' };

function tsAggregate(D, O, Hh, L, C, unit) {
  if (unit === 'd') return D.map((d, i) => ({ d, o: O[i], h: Hh[i], l: L[i], c: C[i] }));
  const key = unit === 'm'
    ? s => s.slice(0, 7)
    : s => { const t = new Date(s); t.setUTCDate(t.getUTCDate() - (t.getUTCDay() + 6) % 7); return t.toISOString().slice(0, 10); };
  const out = [];
  let k0 = null;
  for (let i = 0; i < D.length; i++) {
    const k = key(D[i]);
    if (k !== k0) {
      out.push({ d: D[i], o: O[i], h: Hh[i], l: L[i], c: C[i] });
      k0 = k;
    } else {
      const cur = out[out.length - 1];
      cur.h = Math.max(cur.h, Hh[i]);
      cur.l = Math.min(cur.l, L[i]);
      cur.c = C[i];
      cur.d = D[i];
    }
  }
  return out;
}

function renderBig(box, ch, state) {
  const nAll = ch.close.length;
  const W = 1000, H = 300, ML = 14, MR = 14, MT = 40, MB = 40;
  const PW = W - ML - MR;
  const BH = 46;

  function applyPreset() {
    const days = TS_RANGES[state.preset];
    let s0 = 0;
    if (days !== null) {
      const lastDate = new Date(ch.dates[nAll - 1]);
      const startStr = new Date(lastDate.getTime() - days * 86400e3).toISOString().slice(0, 10);
      s0 = ch.dates.findIndex(d => d >= startStr);
      if (s0 < 0) s0 = 0;
    }
    state.i0 = s0;
    state.i1 = nAll - 1;
  }
  if (state.i0 === null) applyPreset();

  // ── 브러시(미니맵)용 10년 전체 축소 라인 ──
  const bxAll = i => ML + PW * i / (nAll - 1);
  const bLo = Math.min(...ch.close), bHi = Math.max(...ch.close);
  const bys = v => 6 + (BH - 12) * (1 - (v - bLo) / (bHi - bLo || 1));
  const bstep = Math.max(1, Math.ceil(nAll / 500));
  let bpts = '';
  for (let i = 0; i < nAll; i += bstep) bpts += `${bxAll(i).toFixed(1)},${bys(ch.close[i]).toFixed(1)} `;
  bpts += `${bxAll(nAll - 1).toFixed(1)},${bys(ch.close[nAll - 1]).toFixed(1)}`;

  box.innerHTML = `
    <div class="ts-headrow">
      <div>
        <div class="ts-price"></div>
        <div class="ts-sub"><span class="lbl"></span><span class="dt"></span></div>
      </div>
      <div class="ts-type">
        <button class="ts-tab${state.type === 'line' ? ' on' : ''}" data-t="line">선</button>
        <button class="ts-tab${state.type === 'candle' ? ' on' : ''}" data-t="candle">캔들</button>
      </div>
    </div>
    <div class="chwrap">
      <svg class="ts-main" viewBox="0 0 ${W} ${H}" role="img" aria-label="${ch.ticker} 차트"></svg>
      <div class="ts-datepill"></div>
    </div>
    <svg class="ts-brush" viewBox="0 0 ${W} ${BH}">
      <polyline class="ts-bl" points="${bpts}"/>
      <rect class="ts-dim dimL" y="0" height="${BH}" x="0" width="0"/>
      <rect class="ts-dim dimR" y="0" height="${BH}" x="0" width="0"/>
      <rect class="ts-win" y="1" height="${BH - 2}" rx="5"/>
      <rect class="ts-handle hL" y="${BH / 2 - 9}" width="5" height="18" rx="2.5"/>
      <rect class="ts-handle hR" y="${BH / 2 - 9}" width="5" height="18" rx="2.5"/>
    </svg>
    <div class="ts-tabs">
      ${Object.keys(TS_RANGES).map(k => `<button class="ts-tab" data-r="${k}">${k}</button>`).join('')}
    </div>`;

  const mainSvg = box.querySelector('.ts-main');
  const pill = box.querySelector('.ts-datepill');
  const priceEl = box.querySelector('.ts-price');
  const subEl = box.querySelector('.ts-sub');
  const lblEl = subEl.querySelector('.lbl');
  const dtEl = subEl.querySelector('.dt');
  const brush = box.querySelector('.ts-brush');
  const xdateFull = s => s.replaceAll('-', '.');

  function updateBrush() {
    const xl = bxAll(state.i0), xr = bxAll(state.i1);
    brush.querySelector('.dimL').setAttribute('width', Math.max(0, xl).toFixed(1));
    const dimR = brush.querySelector('.dimR');
    dimR.setAttribute('x', xr.toFixed(1));
    dimR.setAttribute('width', Math.max(0, W - xr).toFixed(1));
    const win = brush.querySelector('.ts-win');
    win.setAttribute('x', xl.toFixed(1));
    win.setAttribute('width', Math.max(1, xr - xl).toFixed(1));
    brush.querySelector('.hL').setAttribute('x', (xl - 2.5).toFixed(1));
    brush.querySelector('.hR').setAttribute('x', (xr - 2.5).toFixed(1));
  }

  function drawMain() {
    const i0 = state.i0, i1 = state.i1;
    const C = ch.close.slice(i0, i1 + 1);
    const D = ch.dates.slice(i0, i1 + 1);
    const candle = state.type === 'candle';
    const spanDays = (new Date(D[D.length - 1]) - new Date(D[0])) / 86400e3;
    const unit = spanDays <= 190 ? 'd' : spanDays <= 950 ? 'w' : 'm';
    const B = candle
      ? tsAggregate(D, ch.open.slice(i0, i1 + 1), ch.high.slice(i0, i1 + 1), ch.low.slice(i0, i1 + 1), C, unit)
      : null;
    const n = candle ? B.length : C.length;
    const closeAt = i => candle ? B[i].c : C[i];
    const dateAt = i => candle ? B[i].d : D[i];
    const up = C[C.length - 1] >= C[0];
    const tone = up ? 'ts-up' : 'ts-down';
    const stroke = up ? 'var(--tsu)' : 'var(--tsd)';

    const lo = candle ? Math.min(...B.map(x => x.l)) : Math.min(...C);
    const hi = candle ? Math.max(...B.map(x => x.h)) : Math.max(...C);
    const pad = (hi - lo) * 0.05 || 1;
    const a = lo - pad, b = hi + pad;
    const slot = PW / n;
    const xs = candle
      ? (i => ML + slot * (i + 0.5))
      : (i => ML + PW * (n === 1 ? 0 : i / (n - 1)));
    const ys = v => MT + (H - MT - MB) * (1 - (v - a) / (b - a));

    let marks;
    if (candle) {
      const bw = Math.max(2.4, Math.min(14, slot * 0.62));
      marks = B.map((k, i) => {
        const x = xs(i);
        const col = k.c >= k.o ? 'var(--tsu)' : 'var(--tsd)';
        const yO = ys(k.o), yC = ys(k.c);
        const top = Math.min(yO, yC), hgt = Math.max(1.4, Math.abs(yO - yC));
        return `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${ys(k.h).toFixed(1)}" y2="${ys(k.l).toFixed(1)}" stroke="${col}" stroke-width="1"/>` +
               `<rect x="${(x - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${hgt.toFixed(1)}" fill="${col}" rx="1"/>`;
      }).join('');
    } else {
      const pts = C.map((v, i) => `${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(' ');
      const area = `M${xs(0).toFixed(1)},${(H - MB)} L${pts.replaceAll(' ', ' L')} L${xs(n - 1).toFixed(1)},${H - MB} Z`;
      marks = `<defs><linearGradient id="g-${ch.ticker}" x1="0" y1="0" x2="0" y2="1">` +
              `<stop offset="0" stop-color="${stroke}" stop-opacity="0.14"/><stop offset="1" stop-color="${stroke}" stop-opacity="0"/>` +
              `</linearGradient></defs><path d="${area}" fill="url(#g-${ch.ticker})"/><polyline class="ts-line" stroke="${stroke}" points="${pts}"/>`;
    }

    const iHi = candle ? B.findIndex(k => k.h === hi) : C.indexOf(hi);
    const iLo = candle ? B.findIndex(k => k.l === lo) : C.indexOf(lo);
    const clampX = x => Math.min(Math.max(x, 46), W - 46);

    const short = spanDays <= 190;
    const xdate = s => short ? s.replaceAll('-', '.') : s.slice(0, 7).replace('-', '.');
    let xTicks = '';
    for (let k = 0; k < 4; k++) {
      const i = Math.round((n - 1) * (k + 0.5) / 4);
      xTicks += `<text class="ts-minmax" x="${xs(i).toFixed(1)}" y="${H - 10}" text-anchor="middle">${xdate(dateAt(i))}</text>`;
    }

    const pctOf = v => {
      const p = (v / C[0] - 1) * 100;
      return (p >= 0 ? '+' : '') + p.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
    };

    mainSvg.innerHTML = `
      ${marks}
      ${xTicks}
      <text class="ts-minmax" x="${clampX(xs(iHi)).toFixed(1)}" y="${(ys(hi) - 10).toFixed(1)}" text-anchor="middle">최고 ${fmt.money(hi)}</text>
      <text class="ts-minmax" x="${clampX(xs(iLo)).toFixed(1)}" y="${(ys(lo) + 18).toFixed(1)}" text-anchor="middle">최저 ${fmt.money(lo)}</text>
      <line class="ts-hair" y1="${MT - 14}" y2="${H - MB + 8}" x1="0" x2="0"/>
      <circle class="ts-dot" r="4.5" fill="${stroke}"/>
      <rect class="ov" fill="none" pointer-events="all" x="${ML}" y="0" width="${PW}" height="${H}"/>`;

    const baseLabel = (state.preset && state.i1 === nAll - 1)
      ? TS_LABELS[state.preset]
      : `${xdateFull(D[0])} 이후`;
    priceEl.textContent = fmt.money(C[C.length - 1]);
    subEl.className = `ts-sub ${tone}`;
    lblEl.textContent = `${baseLabel} ${pctOf(C[C.length - 1])}`;
    dtEl.textContent = '';
    box.querySelectorAll('.ts-tab[data-r]').forEach(bn => bn.classList.toggle('on', bn.dataset.r === state.preset));
    box.querySelector('[data-t="candle"]').textContent = candle ? `캔들 · ${TS_BUCKET_NAME[unit]}` : '캔들';

    const hair = mainSvg.querySelector('.ts-hair');
    const dot = mainSvg.querySelector('.ts-dot');
    const overlay = mainSvg.querySelector('.ov');
    overlay.addEventListener('pointermove', e => {
      const bx = mainSvg.getBoundingClientRect();
      const px = (e.clientX - bx.left) / bx.width * W;
      const i = candle
        ? Math.max(0, Math.min(n - 1, Math.floor((px - ML) / slot)))
        : Math.max(0, Math.min(n - 1, Math.round((px - ML) / PW * (n - 1))));
      const x = xs(i);
      hair.setAttribute('x1', x); hair.setAttribute('x2', x);
      hair.style.opacity = 0.6;
      if (!candle) {
        dot.setAttribute('cx', x); dot.setAttribute('cy', ys(closeAt(i)));
        dot.style.opacity = 1;
      }
      priceEl.textContent = fmt.money(closeAt(i));
      lblEl.textContent = `시작 대비 ${pctOf(closeAt(i))}`;
      dtEl.textContent = dateAt(i);
      const wrapBox = box.querySelector('.chwrap').getBoundingClientRect();
      pill.style.left = Math.min(Math.max((x / W) * wrapBox.width, 34), wrapBox.width - 34) + 'px';
      pill.textContent = dateAt(i);
      pill.style.opacity = 1;
    });
    overlay.addEventListener('pointerleave', () => {
      hair.style.opacity = 0; dot.style.opacity = 0; pill.style.opacity = 0;
      priceEl.textContent = fmt.money(C[C.length - 1]);
      lblEl.textContent = `${baseLabel} ${pctOf(C[C.length - 1])}`;
      dtEl.textContent = '';
    });
  }

  updateBrush();
  drawMain();

  box.querySelectorAll('.ts-tab[data-r]').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    state.preset = btn.dataset.r;
    applyPreset();
    updateBrush();
    drawMain();
  }));
  box.querySelectorAll('.ts-type .ts-tab').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation();
    state.type = btn.dataset.t;
    box.querySelectorAll('.ts-type .ts-tab').forEach(bn => bn.classList.toggle('on', bn === btn));
    drawMain();
  }));
  box.querySelector('.chwrap').addEventListener('click', e => e.stopPropagation());
  brush.addEventListener('click', e => e.stopPropagation());

  // ── 브러시 드래그: 양 끝 = 기간 조절, 가운데 = 이동, 바깥 클릭 = 그 위치로 점프 ──
  const MINSPAN = 5;
  const toX = e => { const r = brush.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; };
  const toI = x => Math.max(0, Math.min(nAll - 1, Math.round((x - ML) / PW * (nAll - 1))));
  let drag = null, raf = false;
  const schedule = () => { if (!raf) { raf = true; requestAnimationFrame(() => { raf = false; drawMain(); }); } };
  brush.addEventListener('pointerdown', e => {
    const x = toX(e);
    const xl = bxAll(state.i0), xr = bxAll(state.i1);
    if (Math.abs(x - xl) < 12) drag = { mode: 'l' };
    else if (Math.abs(x - xr) < 12) drag = { mode: 'r' };
    else if (x > xl && x < xr) drag = { mode: 'move', off: toI(x) - state.i0 };
    else {
      const span = state.i1 - state.i0;
      const i0 = Math.max(0, Math.min(nAll - 1 - span, toI(x) - Math.round(span / 2)));
      state.i0 = i0; state.i1 = i0 + span;
      state.preset = null;
      drag = { mode: 'move', off: toI(x) - state.i0 };
      updateBrush(); schedule();
    }
    brush.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  brush.addEventListener('pointermove', e => {
    if (!drag) {
      const x = toX(e);
      const xl = bxAll(state.i0), xr = bxAll(state.i1);
      brush.style.cursor = (Math.abs(x - xl) < 12 || Math.abs(x - xr) < 12) ? 'ew-resize'
        : (x > xl && x < xr ? 'grab' : 'pointer');
      return;
    }
    const i = toI(toX(e));
    if (drag.mode === 'l') state.i0 = Math.min(i, state.i1 - MINSPAN);
    else if (drag.mode === 'r') state.i1 = Math.max(i, state.i0 + MINSPAN);
    else {
      const span = state.i1 - state.i0;
      const i0 = Math.max(0, Math.min(nAll - 1 - span, i - drag.off));
      state.i0 = i0; state.i1 = i0 + span;
    }
    state.preset = null;
    updateBrush();
    schedule();
  });
  brush.addEventListener('pointerup', () => { drag = null; });
  brush.addEventListener('pointercancel', () => { drag = null; });
}

  makeTable(d.stocks, [

    { label: '최저 분기평균', val: r => r.roll_min_b, cell: r => '$' + r.roll_min_b.toFixed(2) + 'B' },
    { label: '관심도 (1개월/2년)', val: r => r.interest_ratio, cell: r => r.interest_ratio.toFixed(2) + '×' },
  ], 'stock-table', '조건 1을 통과한 종목이 없습니다.', loadChart);

  document.getElementById('footer').innerHTML = `
    <strong>조건 1 — 시장의 지속적 관심</strong>
    <ul>
      <li>일일 거래대금 = 종가 × 거래량 (배당·분할 반영 수정종가, Yahoo Finance)</li>
      <li>분기(${cfg.SUSTAIN_WINDOW_DAYS}거래일) 이동평균 거래대금이 최근 ${cfg.LIQUIDITY_YEARS}년 동안 한 번도 $${cfg.MIN_DOLLAR_VOLUME_M}M 아래로 내려가지 않아야 통과</li>
      <li>관심도 = 최근 ${cfg.INTEREST_RECENT_DAYS}거래일 평균 거래대금 ÷ ${cfg.LIQUIDITY_YEARS}년 평균 — 1보다 크면 최근 관심 증가</li>
      <li>${cfg.LIQUIDITY_YEARS}년치 데이터가 없는 종목(최근 상장 등)은 검증 불가로 제외</li>
    </ul>
    이 도구는 후보 발굴용이며 매수 판단과 책임은 사용자에게 있습니다.`;
}
main().catch(e => {
  document.getElementById('kpis').innerHTML = `<div class="empty">data.json을 불러오지 못했습니다: ${e}</div>`;
